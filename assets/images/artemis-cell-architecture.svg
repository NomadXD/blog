<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#B0B0B0"/>
    </marker>
    <style>
      .cell-shape { fill: #F5F5F5; stroke: #C0C0C0; stroke-width: 1.5; }
      .comp-circle { fill: #FFFFFF; stroke: #A0A0A0; stroke-width: 1.2; }
      .gw-diamond { fill: #E8E8E8; stroke: #909090; stroke-width: 1; }
      .cell-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #555; text-anchor: middle; }
      .comp-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 8.5px; fill: #888; text-anchor: middle; }
      .conn-line { stroke: #B8B8B8; stroke-width: 1.5; stroke-dasharray: 8,5; fill: none; marker-end: url(#arrowhead); }
      .conn-label-bg { fill: white; opacity: 0.9; }
      .conn-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 8px; fill: #AAA; text-anchor: middle; font-style: italic; }
      .internal-line { stroke: #D8D8D8; stroke-width: 0.8; }
      .icon-stroke { stroke: #B0B0B0; stroke-width: 0.7; fill: none; }
      .waypoint-body { fill: #E8E8E8; stroke: #909090; stroke-width: 1.2; }
      .waypoint-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 7px; fill: #888; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="white"/>

  <!-- ========== INTER-CELL CONNECTIONS (bottom layer) ========== -->
  <g id="connections">
    <line class="conn-line" x1="352" y1="228" x2="568" y2="273"/>
    <line class="conn-line" x1="832" y1="273" x2="1048" y2="228"/>
    <line class="conn-line" x1="1139" y1="329" x2="1061" y2="572"/>
    <line class="conn-line" x1="936" y1="595" x2="784" y2="405"/>
    <line class="conn-line" x1="481" y1="592" x2="619" y2="408"/>
  </g>

  <!-- Connection labels -->
