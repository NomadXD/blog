    <rect class="conn-label-bg" x="425" y="233" width="52" height="14" rx="3"/>
    <text class="conn-label" x="451" y="244">handoff</text>
    <rect class="conn-label-bg" x="905" y="233" width="62" height="14" rx="3"/>
    <text class="conn-label" x="936" y="244">commands</text>
    <rect class="conn-label-bg" x="1080" y="438" width="58" height="14" rx="3"/>
