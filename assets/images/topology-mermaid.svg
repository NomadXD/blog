<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2c3e50; }
      .small-label { font-family: Arial, sans-serif; font-size: 12px; fill: #7f8c8d; }
      .arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .ns-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      .ew-arrow { stroke: #27ae60; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .k8s-border { fill: #f8f9fa; stroke: #2c3e50; stroke-width: 2; }
      .namespace { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; }
      .gateway { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; }
      .app { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; }
      .external { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2; }
      .users { fill: #fce4ec; stroke: #e91e63; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" class="title">Multi-tenant Kubernetes Architecture</text>
  <text x="500" y="70" text-anchor="middle" class="subtitle">with Envoy Gateway and Cilium</text>

  <!-- External Users -->
  <circle cx="500" cy="120" r="40" class="users"/>
  <text x="500" y="125" text-anchor="middle" class="label">External</text>
  <text x="500" y="140" text-anchor="middle" class="small-label">Users</text>

  <!-- Kubernetes Cluster -->
  <rect x="100" y="180" width="800" height="370" rx="10" class="k8s-border"/>
  <text x="200" y="210" text-anchor="middle" class="subtitle">Kubernetes Cluster</text>

  <!-- External Gateway -->
  <rect x="400" y="240" width="200" height="60" rx="5" class="gateway"/>
  <text x="500" y="270" text-anchor="middle" class="label">External Gateway</text>
  <text x="500" y="285" text-anchor="middle" class="small-label">[Envoy Proxy]</text>

  <!-- Tenant Namespaces -->
  <!-- Sales -->
  <rect x="150" y="340" width="200" height="100" rx="5" class="namespace"/>
  <text x="250" y="365" text-anchor="middle" class="subtitle">tenant-sales</text>
  <rect x="175" y="380" width="150" height="40" rx="5" class="app"/>
  <text x="250" y="405" text-anchor="middle" class="label">Sales App</text>

  <!-- Marketing -->
  <rect x="400" y="340" width="200" height="100" rx="5" class="namespace"/>
  <text x="500" y="365" text-anchor="middle" class="subtitle">tenant-marketing</text>
  <rect x="425" y="380" width="150" height="40" rx="5" class="app"/>
  <text x="500" y="405" text-anchor="middle" class="label">Marketing App</text>

  <!-- Finance -->
  <rect x="650" y="340" width="200" height="100" rx="5" class="namespace"/>
  <text x="750" y="365" text-anchor="middle" class="subtitle">tenant-finance</text>
  <rect x="675" y="380" width="150" height="40" rx="5" class="app"/>
  <text x="750" y="405" text-anchor="middle" class="label">Finance App</text>

  <!-- Internal Gateway -->
  <rect x="400" y="480" width="200" height="60" rx="5" class="gateway"/>
  <text x="500" y="510" text-anchor="middle" class="label">Internal Gateway</text>
  <text x="500" y="525" text-anchor="middle" class="small-label">[Envoy Proxy]</text>

  <!-- External Services -->
  <rect x="50" y="560" width="150" height="30" rx="5" class="external"/>
  <text x="125" y="580" text-anchor="middle" class="small-label">api.salesforce.com</text>

  <rect x="210" y="560" width="180" height="30" rx="5" class="external"/>
  <text x="300" y="580" text-anchor="middle" class="small-label">analyticsdata.googleapis.com</text>

  <rect x="800" y="560" width="150" height="30" rx="5" class="external"/>
  <text x="875" y="585" text-anchor="middle" class="small-label">Legacy System</text>
  <text x="875" y="575" text-anchor="middle" class="small-label">203.0.113.0/24</text>

  <!-- North-South Traffic -->
  <path d="M 500 160 L 500 240" class="ns-arrow"/>
  <path d="M 500 300 L 250 340" class="ns-arrow"/>
  <path d="M 500 300 L 500 340" class="ns-arrow"/>
  <path d="M 500 300 L 750 340" class="ns-arrow"/>

  <!-- East-West Traffic -->
  <path d="M 250 420 L 250 510 L 400 510" class="ew-arrow"/>
  <path d="M 500 420 L 500 480" class="ew-arrow"/>
  <path d="M 750 420 L 750 510 L 600 510" class="ew-arrow"/>

  <!-- External Service Access -->
  <path d="M 175 420 L 125 560" class="arrow"/>
  <path d="M 500 420 L 240 560" class="arrow"/>
  <path d="M 825 420 L 875 560" class="arrow"/>
</svg>